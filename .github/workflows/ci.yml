name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC: rescan for newly published CVEs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Quick checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Vote - Python syntax check
        run: python3 -m py_compile vote/app.py

  integration-test:
    name: Integration test
    runs-on: ubuntu-24.04
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Run vote -> result end-to-end test
        run: docker compose -f result/docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from sut
      - name: Clean up
        if: always()
        run: docker compose -f result/docker-compose.test.yml down -v

  build-scan-push:
    name: ${{ matrix.service }}
    needs: [checks, integration-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: vote
            context: vote
            target: final
          - service: result
            context: result
            target: final
          - service: worker
            context: worker
            target: ""
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/voting-${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (local only, not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Trivy scan (fails on HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        run: docker push ${{ env.IMAGE }}:${{ github.sha }}
  deploy:
    name: Deploy to EKS
    needs: build-scan-push
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write    # lets the job ask GitHub for an OIDC token
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Point kubectl at the cluster
        run: aws eks update-kubeconfig --region eu-west-1 --name voting-app

      - name: Helm upgrade
        id: deploy
        run: |
          helm upgrade --install voting helm/voting-app \
            --namespace voting \
            --set image.tag=${{ github.sha }} \
            --wait --timeout 5m

      - name: Roll back on failure
        if: failure() && steps.deploy.conclusion == 'failure'
        run: helm rollback voting --namespace voting --wait || true